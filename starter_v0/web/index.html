<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medication Adherence Assistant</title>
<style>
  :root {
    --bg: #f4f7f6;
    --panel: #ffffff;
    --border: #e1e8e6;
    --text: #1c2b28;
    --muted: #6b7b78;
    --accent: #0e7c66;
    --accent-soft: #e5f4ef;
    --user-bubble: #0e7c66;
    --assistant-bubble: #eef2f1;
    --warn: #b8860b;
    --warn-bg: #fff7e0;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --ok: #2e7d32;
    --ok-bg: #eaf6ea;
    --info: #2b6cb0;
    --info-bg: #eaf2fb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .title .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  header .meta span b { color: var(--text); font-weight: 600; }
  header button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  header button:hover { background: var(--accent-soft); border-color: var(--accent); }

  main.chat {
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--border);
    background: var(--bg);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .row.assistant .bubble { background: var(--assistant-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .row.assistant .bubble.waiting { background: var(--warn-bg); border: 1px solid #f0dca0; }
  .row.assistant .bubble.error { background: var(--danger-bg); border: 1px solid #f0b4ac; }
  .row.system .bubble { background: transparent; color: var(--muted); font-size: 12px; text-align: center; margin: 0 auto; }

  .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .quick-replies button {
    border: 1px solid var(--accent);
    color: var(--accent);
    background: #fff;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .quick-replies button:hover { background: var(--accent-soft); }

  .typing { display: flex; gap: 4px; padding: 10px 14px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  form#composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    min-height: 42px;
    max-height: 120px;
  }
  form#composer textarea:focus { outline: none; border-color: var(--accent); }
  form#composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  form#composer button:disabled { opacity: .5; cursor: default; }

  aside.activity {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  aside.activity h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0;
    padding: 14px 16px 8px;
    border-bottom: 1px solid var(--border);
  }
  #activity-log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #activity-log .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .tool-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    background: #fbfcfc;
  }
  .tool-card .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .tool-badge {
    font-weight: 700;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--info-bg);
    color: var(--info);
  }
  .tool-badge.clarify { background: var(--warn-bg); color: var(--warn); }
  .tool-badge.escalate_to_clinician { background: var(--danger-bg); color: var(--danger); }
  .tool-badge.notify_caregiver { background: #fdeee0; color: #b5651d; }
  .tool-badge.confirm_dose_taken { background: var(--ok-bg); color: var(--ok); }
  .tool-badge.record_side_effect { background: #f1e8fb; color: #6a3ea1; }
  .tool-card .turn-tag { color: var(--muted); font-size: 11px; }
  .tool-card .args { color: var(--muted); margin-bottom: 6px; }
  .tool-card .args code { background: #eef1f0; padding: 1px 4px; border-radius: 4px; }
  .tool-card details summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  .tool-card pre {
    margin: 6px 0 0;
    padding: 8px;
    background: #0f1f1c;
    color: #d7ecdf;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 11.5px;
    line-height: 1.4;
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    aside.activity { display: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <span class="dot"></span>
        <h1>Medication Adherence Assistant</h1>
      </div>
      <div class="meta">
        <span>Provider: <b id="meta-provider">–</b></span>
        <span>Model: <b id="meta-model">–</b></span>
        <span>Version: <b id="meta-version">–</b></span>
      </div>
      <button id="reset-btn" type="button">New conversation</button>
    </header>

    <main class="chat">
      <div id="messages"></div>
      <form id="composer">
        <textarea id="input" placeholder="Nhập tin nhắn… (vd: Bệnh nhân P001 báo bị chóng mặt sau khi uống thuốc)" rows="1"></textarea>
        <button id="send-btn" type="submit">Gửi</button>
      </form>
    </main>

    <aside class="activity">
      <h2>Tool activity</h2>
      <div id="activity-log"><div class="empty">Chưa có tool nào được gọi.</div></div>
    </aside>
  </div>

<script>
(function () {
  const messagesEl = document.getElementById("messages");
  const activityEl = document.getElementById("activity-log");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const resetBtn = document.getElementById("reset-btn");

  let sessionId = null;
  let busy = false;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemNote(text) {
    const row = document.createElement("div");
    row.className = "row system";
    row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addUserMessage(text) {
    const row = document.createElement("div");
    row.className = "row user";
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector(".bubble").textContent = text;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addAssistantMessage(text, { waiting = false, error = false, quickReplies = null } = {}) {
    const row = document.createElement("div");
    row.className = "row assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (waiting ? " waiting" : "") + (error ? " error" : "");
    bubble.textContent = text;
    row.appendChild(bubble);

    if (quickReplies && quickReplies.length) {
      const wrap = document.createElement("div");
      wrap.className = "quick-replies";
      quickReplies.forEach((label) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        btn.addEventListener("click", () => sendMessage(label));
        wrap.appendChild(btn);
      });
      row.appendChild(wrap);
    }
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement("div");
    row.className = "row assistant";
    row.id = "typing-row";
    row.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function clearActivityLog() {
    activityEl.innerHTML = '<div class="empty">Chưa có tool nào được gọi.</div>';
  }

  function addToolCard(turnIndex, event) {
    const empty = activityEl.querySelector(".empty");
    if (empty) empty.remove();

    const card = document.createElement("div");
    card.className = "tool-card";

    const badge = document.createElement("span");
    badge.className = "tool-badge " + event.tool;
    badge.textContent = event.tool;

    const turnTag = document.createElement("span");
    turnTag.className = "turn-tag";
    turnTag.textContent = "turn " + turnIndex;

    const head = document.createElement("div");
    head.className = "head";
    head.appendChild(badge);
    head.appendChild(turnTag);
    card.appendChild(head);

    if (event.args && Object.keys(event.args).length) {
      const args = document.createElement("div");
      args.className = "args";
      args.innerHTML = Object.entries(event.args)
        .map(([k, v]) => `<code>${escapeHtml(k)}=${escapeHtml(JSON.stringify(v))}</code>`)
        .join(" ");
      card.appendChild(args);
    }

    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Xem kết quả";
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(event.result, null, 2);
    details.appendChild(summary);
    details.appendChild(pre);
    card.appendChild(details);

    activityEl.appendChild(card);
    activityEl.scrollTop = activityEl.scrollHeight;
  }

  function extractClarifyReplies(turnRecord) {
    const events = turnRecord.tool_events || [];
    const last = events[events.length - 1];
    if (!last || last.tool !== "clarify") return null;
    const result = last.result || {};
    if (result.response_type === "yes_no") return ["Có", "Không"];
    if (result.response_type === "choice" && Array.isArray(result.options) && result.options.length) {
      return result.options;
    }
    return null;
  }

  async function startSession() {
    const res = await fetch("/api/session", { method: "POST" });
    const data = await res.json();
    sessionId = data.session_id;
    document.getElementById("meta-provider").textContent = data.provider;
    document.getElementById("meta-model").textContent = data.model;
    document.getElementById("meta-version").textContent = data.artifact_version;
  }

  async function sendMessage(text) {
    if (busy || !text.trim()) return;
    busy = true;
    sendBtn.disabled = true;

    addUserMessage(text);
    input.value = "";
    input.style.height = "auto";
    const typingRow = addTypingIndicator();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      typingRow.remove();

      if (!res.ok) {
        addAssistantMessage(data.error || "Đã có lỗi xảy ra.", { error: true });
        return;
      }

      (data.tool_events || []).forEach((event) => addToolCard(data.turn_index, event));

      if (data.status === "provider_error") {
        addAssistantMessage(data.assistant_text || "Lỗi provider.", { error: true });
      } else if (data.status === "waiting_for_user") {
        addAssistantMessage(data.assistant_text || "", {
          waiting: true,
          quickReplies: extractClarifyReplies(data),
        });
      } else if (data.status === "max_tool_rounds") {
        addAssistantMessage(data.assistant_text || "", { error: true });
      } else {
        addAssistantMessage(data.assistant_text || "");
      }
    } catch (err) {
      typingRow.remove();
      addAssistantMessage("Không thể kết nối tới server: " + err.message, { error: true });
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    sendMessage(input.value);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input.value);
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  resetBtn.addEventListener("click", async () => {
    if (busy) return;
    messagesEl.innerHTML = "";
    clearActivityLog();
    await startSession();
    addSystemNote("Đã bắt đầu cuộc hội thoại mới.");
  });

  startSession().then(() => {
    addSystemNote("Kết nối thành công. Hãy mô tả tình huống hoặc câu hỏi về việc uống thuốc.");
  });
})();
</script>
</body>
</html>
