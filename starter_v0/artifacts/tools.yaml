tools:
  - name: clarify
    description: "Hỏi lại thông tin còn thiếu hoặc xác nhận một hành động nhạy cảm trước khi tiếp tục. Dùng khi thiếu patient_id, medication_name, caregiver authorization, hoặc cần xác nhận các thay đổi điều trị." 
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn gọn"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Loại câu trả lời cần"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu có"}
      required: [question]

  - name: view_medication_plan
    description: "Xem lịch uống thuốc đã được phê duyệt cho bệnh nhân trong khung thời gian cụ thể. Chỉ dùng khi đã có patient_id; nếu thiếu, hỏi lại." 
    parameters:
      type: object
      properties:
        patient_id: {type: string, description: "Mã bệnh nhân"}
        medication_name: {type: string, default: "", description: "Tên thuốc nếu cần lọc"}
        time_window: {type: string, enum: [today, tomorrow, week], default: "today", description: "Khung thời gian"}
      required: [patient_id]

  - name: check_reminder_schedule
    description: "Kiểm tra lịch nhắc thuốc và các liều bị bỏ qua. Chỉ dùng khi đã có bệnh nhân và, nếu có thể, tên thuốc; nếu thiếu, hỏi lại thay vì đoán." 
    parameters:
      type: object
      properties:
        patient_id: {type: string, description: "Mã bệnh nhân"}
        medication_name: {type: string, default: "", description: "Tên thuốc"}
        day: {type: string, enum: [today, tomorrow, recent], default: "today", description: "Ngày cần kiểm tra"}
      required: [patient_id]

  - name: confirm_dose_taken
    description: "Ghi nhận một liều thuốc đã được bệnh nhân hoặc người giám hộ xác nhận đã uống. Không dùng cho thay đổi đơn thuốc hoặc điều trị." 
    parameters:
      type: object
      properties:
        patient_id: {type: string, description: "Mã bệnh nhân"}
        medication_name: {type: string, description: "Tên thuốc"}
        time_taken: {type: string, description: "Thời điểm uống thuốc"}
        confirmed_by: {type: string, enum: [patient, caregiver, clinician], default: "patient", description: "Người xác nhận"}
      required: [patient_id, medication_name, time_taken]

  - name: record_side_effect
    description: "Ghi nhận tác dụng phụ hoặc triệu chứng bất thường sau khi dùng thuốc. Dùng cho mức độ mild/moderate/severe và không thay thế xử trí cấp cứu." 
    parameters:
      type: object
      properties:
        patient_id: {type: string, description: "Mã bệnh nhân"}
        medication_name: {type: string, description: "Tên thuốc"}
        symptom: {type: string, description: "Triệu chứng"}
        severity: {type: string, enum: [mild, moderate, severe], default: "moderate", description: "Mức độ"}
        confirmed: {type: boolean, default: false, description: "Đã xác nhận bởi bệnh nhân hoặc nhân viên"}
      required: [patient_id, medication_name, symptom]

  - name: lookup_policy
    description: "Tra cứu chính sách nội bộ về nhắc thuốc, cảnh báo, chuyển bác sĩ và bảo mật dữ liệu bệnh nhân." 
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tra cứu"}
        policy_area: {type: string, enum: [all, adherence, escalation, privacy, caregiver], default: "all", description: "Lĩnh vực chính sách"}
        top_k: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: [query]

  - name: notify_caregiver
    description: "Gửi cảnh báo ngắn gọn cho người thân/giám hộ được ủy quyền khi có sự cố tuân thủ thuốc. Không gửi PHI hoặc chi tiết nhạy cảm." 
    parameters:
      type: object
      properties:
        patient_id: {type: string, description: "Mã bệnh nhân"}
        caregiver_id: {type: string, description: "Mã người thân được ủy quyền"}
        message: {type: string, description: "Thông báo ngắn gọn"}
        confirmed: {type: boolean, default: false, description: "Đã xác nhận quyền gửi thông báo"}
      required: [patient_id, caregiver_id, message]

  - name: escalate_to_clinician
    description: "Chuyển vụ việc lên bác sĩ hoặc cấp cứu khi có triệu chứng nghiêm trọng hoặc nguy cơ an toàn. Dùng ngay cho khó thở, đau ngực, choáng váng, phù mạch hoặc các dấu hiệu cấp tính." 
    parameters:
      type: object
      properties:
        patient_id: {type: string, description: "Mã bệnh nhân"}
        urgency: {type: string, enum: [urgent, emergency], default: "urgent", description: "Mức độ khẩn cấp"}
        reason: {type: string, description: "Lý do chuyển bác sĩ hoặc cấp cứu"}
      required: [patient_id, reason]

  - name: search_medical_guide
    description: "Tra cứu hướng dẫn y tế tham khảo để hỗ trợ hiểu biết, chỉ đọc và không thay đổi phác đồ điều trị hay liều thuốc." 
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, adherence, side_effect, emergency, dosage], default: "all", description: "Nhóm tài liệu"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]
